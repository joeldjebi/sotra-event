name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: eventtrans_testing
          POSTGRES_USER: eventtrans
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventtrans"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eventtrans_testing
      DB_USERNAME: eventtrans
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_CLIENT: predis

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, sodium, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dépendances front et build
        run: |
          npm ci
          npm run build

      - name: Préparation de l'application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint, Larastan et Pest
        run: composer check
