# Services locaux EVENT TRANS : PostgreSQL + PostGIS et Redis.
# Ports décalés pour ne pas entrer en conflit avec d'autres projets.
services:
  pgsql:
    # Build multi-arch (arm64 + amd64) des images PostGIS officielles
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_DATABASE:-eventtrans}
      POSTGRES_USER: ${DB_USERNAME:-eventtrans}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5450}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/pgsql/create-testing-database.sh:/docker-entrypoint-initdb.d/20-create-testing-database.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-eventtrans}", "-U", "${DB_USERNAME:-eventtrans}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6395}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgsql-data:
  redis-data:
